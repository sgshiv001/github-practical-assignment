name: Practical CI and GitOps validation

on:
  push:
    branches:
      - practicals/ci-gitops
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate desired state
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Compile validator
        run: python -m py_compile scripts/validate_desired_state.py
      - name: Validate declared state
        run: python scripts/validate_desired_state.py
